wingman.description: "Классический CS на стороне A карты Dust II. Лонг и шорт открыты; до пяти игроков в команде."
wingman.rules: "Напарники: правила и размер команд как в классике, плент только A. Лонг и шорт открыты; B, тёмка и двери мида закрыты."
description: "T против CT: закупайте оружие, устанавливайте или обезвреживайте C4 и выигрывайте раунды."
