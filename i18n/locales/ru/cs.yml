# Free-for-all deathmatch.
mode.deathmatch: "Дезматч"
dm.description: "Все против всех на Dust II: бесплатное оружие, возрождения и победа по убийствам."
dm.error.roster: "Для дезматча нужны 2–16 игроков, либо один игрок в тестовом режиме."
dm.rules: "Дезматч: все против всех, без C4 и экономики. Возрождение через 3 секунды; защита на 3 секунды снимается вашим выстрелом или атакой ножом. Выбор оружия: /cs buy или ПКМ с радаром. Выигрывает игрок с большим числом убийств; при равенстве — с меньшим числом смертей."
dm.controls: "ПКМ: огонь. ЛКМ: нож или прицел у оружия с оптикой. F: перезарядка, запас патронов не кончается. /cs buy или ПКМ с радаром: бесплатный выбор оружия. /cs score: таблица убийств. Выбор применяется во время подготовки или защиты после появления, иначе — при следующем возрождении."
dm.start: "Дезматч на <arg:0> мин. Начальная экипировка: AK-47, USP-S, бронежилет и шлем."
