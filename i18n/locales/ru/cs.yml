side.ct: "CT"
team.red: "Красные"
team.blue: "Синие"
loading: "Загрузка Dust II: <arg:0>%"
rules: "Разминирование: возрождение только в следующем раунде. Закупка на спавне; удерживайте ПКМ с предметом в слоте 8 для установки C4 на A/B или разминирования. Управление: /cs help."
map_credit: "Dust II: xjqsh / LesRaisinsStudio; оригинальная карта: Valve. Карта используется на некоммерческих условиях автора."
controls: "ПКМ: стрельба/короткий бросок/использование. ЛКМ с гранатой: дальний бросок. ЛКМ: нож или прицел у винтовок с оптикой. F: перезарядка. Q: выбросить. Слот 8: удерживайте ПКМ для установки/разминирования. Слот 9: радар и закупка по ПКМ на спавне. Перед подбором другого оружия выбросьте текущее. Shift: тихий шаг; после смерти — смена наблюдаемого союзника. /cs pause: тактическая пауза. /cs score: кто жив и кто мёртв. Shift + ПКМ с радаром: список игроков. !сообщение: командный чат."
controls.gun: "ПКМ: огонь • F: перезарядка • Q: выбросить"
controls.pistol: "ПКМ: один выстрел на нажатие • F: перезарядка • Q: выбросить"
controls.throw: "ПКМ: короткий бросок, как зелье. ЛКМ: дальний бросок, как снежок. Максимум четыре гранаты, из них до двух световых."
controls.knife: "ЛКМ: быстрый удар • ПКМ: сильный удар • Удары в спину наносят больше урона."
controls.plant: "На A/B стойте на земле и удерживайте ПКМ 3,2 секунды. Q: выбросить."
controls.defuse: "Смотрите на установленную C4 с расстояния до трёх блоков и удерживайте ПКМ <arg:0> секунд."
controls.buy: "Держите в руке, чтобы видеть радар. ПКМ на спавне: закупка; также работает /cs buy. Shift + ПКМ или /cs score: кто жив и кто мёртв."
