# Potato Minigames core settings.
# Edit at runtime with `/pm config <path> [value]`, e.g. `/pm config queue.countdownSeconds 30`;
# `/pm config` alone lists everything. Game settings live in games/<game>.yml (`/<game> config`).

# Register the /dummy test game (development only).
enableDummyGame: false

# Reset the warfare game world from a slime template before each game.
asp:
  enable: false
  templateWorld: template
  gameWorld: game
  resetOnStart: true

# Lobby players wait in, in adventure mode with the game menu; inventories are restored on leave.
# With Multiverse's enforce-gamemode on, set the lobby world's gamemode to adventure too.
lobby:
  enabled: true
  world: lobby
  # Send first-time players to the lobby.
  firstJoinToLobby: true
  # Hotbar slot of the menu item.
  menuSlot: 4

# Countdown lengths. The countdown only shortens: everyoneQueuedSeconds once every free
# player is queued, voteSeconds once the queue votes with /play vote.
queue:
  countdownSeconds: 60
  everyoneQueuedSeconds: 15
  voteSeconds: 5
  # Idle seconds before a player is removed from their queue.
  afkSeconds: 300

# One queue per game and mode. maxPlayers 0 means no limit; overflow players spectate.
queues:
  pillars:
    original: {enabled: true, minPlayers: 2, maxPlayers: 16}
    chaos: {enabled: true, minPlayers: 2, maxPlayers: 16}
    item-shuffle: {enabled: true, minPlayers: 2, maxPlayers: 16}
    lucky: {enabled: true, minPlayers: 2, maxPlayers: 16}
    tactical: {enabled: true, minPlayers: 2, maxPlayers: 16}
    big_house: {enabled: true, minPlayers: 2, maxPlayers: 16}
    party: {enabled: true, minPlayers: 2, maxPlayers: 16}
    rave: {enabled: true, minPlayers: 2, maxPlayers: 16}
    adhd: {enabled: true, minPlayers: 2, maxPlayers: 16}
    perks: {enabled: true, minPlayers: 2, maxPlayers: 16}
    fusion: {enabled: true, minPlayers: 2, maxPlayers: 16}
  bingo:
    default: {enabled: true, minPlayers: 1, maxPlayers: 0}
    butfast: {enabled: true, minPlayers: 1, maxPlayers: 0}
    collectall: {enabled: true, minPlayers: 1, maxPlayers: 0}
  war:
    classic: {enabled: true, minPlayers: 2, maxPlayers: 0}
    team_beacon: {enabled: true, minPlayers: 2, maxPlayers: 0}
  chase:
    default: {enabled: true, minPlayers: 2, maxPlayers: 0}
  party:
    pvp: {enabled: true, minPlayers: 2, maxPlayers: 12}
    sumo: {enabled: true, minPlayers: 2, maxPlayers: 12}
    pvp_ffa: {enabled: true, minPlayers: 2, maxPlayers: 16}
    sumo_ffa: {enabled: true, minPlayers: 2, maxPlayers: 16}
    arms_race: {enabled: true, minPlayers: 2, maxPlayers: 16}
    one_shot: {enabled: true, minPlayers: 2, maxPlayers: 16}
    tnt_run: {enabled: true, minPlayers: 2, maxPlayers: 16}
    mob_count: {enabled: true, minPlayers: 2, maxPlayers: 16}
    rhino: {enabled: true, minPlayers: 2, maxPlayers: 16}
    miners: {enabled: true, minPlayers: 2, maxPlayers: 12}
    magic_battle: {enabled: true, minPlayers: 2, maxPlayers: 12}
    color_floor: {enabled: true, minPlayers: 2, maxPlayers: 12}
    anvils: {enabled: true, minPlayers: 2, maxPlayers: 12}
    build_memory: {enabled: true, minPlayers: 2, maxPlayers: 12}
    tool_race: {enabled: true, minPlayers: 2, maxPlayers: 12}
    parkour_race: {enabled: true, minPlayers: 2, maxPlayers: 12}
    party_games: {enabled: true, minPlayers: 2, maxPlayers: 12}

  cs:
    default: {enabled: true, minPlayers: 2, maxPlayers: 10}
